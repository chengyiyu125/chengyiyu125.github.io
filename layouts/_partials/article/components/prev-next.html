{{ $prev := .PrevInSection }}
{{ $next := .NextInSection }}
{{ if or $prev $next }}
<nav class="post-nav">
    {{ with $prev }}
    <a class="post-nav__item post-nav__prev" href="{{ .RelPermalink }}">
        <span class="post-nav__label"><span class="post-nav__arrow">←</span> 上一篇</span>
        <span class="post-nav__title">{{ .Title }}</span>
    </a>
    {{ end }}
    {{ with $next }}
    <a class="post-nav__item post-nav__next" href="{{ .RelPermalink }}">
        <span class="post-nav__label">下一篇 <span class="post-nav__arrow">→</span></span>
        <span class="post-nav__title">{{ .Title }}</span>
    </a>
    {{ end }}
</nav>
{{ end }}
